<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APNG 轉 GIF｜ClientKit</title>
    <meta
      name="description"
      content="在瀏覽器端將 APNG 動畫轉換為 GIF，保留動畫與透明效果，檔案不會上傳。"
    />
    <!-- 讓瀏覽器在任何 CSS 套用前就能為深色偏好使用者選深色預設畫布（配合下方換頁白閃防護 style）。 -->
    <meta name="color-scheme" content="light dark" />
    <!--
      主題切換 FOUC 防護（(internal design doc) §D4，
      實文釘死；四個工具頁 byte-identical）：在樣式表套用前先讀
      localStorage 的手動切換紀錄並補上 data-theme，避免「深色 OS 手選
      淺色」重整時先閃一下深色 UA 預設。優先次序（localStorage＞系統＞
      淺色）與 toggle 鈕的 wiring／aria-pressed 同步在 src/theme.ts，
      main.ts 於任何渲染前 import。
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('clientkit-theme');
          if (t === 'dark' || t === 'light')
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <style>
      /* 防換頁白閃：首繪前先給 html 主題底色（色值須與 src/style.css 的 --bg／--dark-bg 保持同步） */
      html { background-color: #ffffff; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) { background-color: #0f1419; }
      }
      html[data-theme='dark'] { background-color: #0f1419; }
    </style>
  </head>
  <body>
    <header>
      <a href="../../" class="back-link">← 返回 ClientKit</a>
      <h1>APNG 轉 GIF</h1>
      <p>選擇一個 APNG 檔案，在瀏覽器端轉換為 GIF；檔案不會上傳到任何伺服器。</p>
      <button type="button" class="theme-toggle" aria-pressed="false">深色模式切換</button>
    </header>
    <main>
      <section class="tool-section" aria-labelledby="select-heading">
        <h2 id="select-heading">選擇檔案</h2>
        <!--
          整個卡片內容包在 <label> 裡：原生 label 點擊語意讓「點卡片任一處」
          與「點選擇檔案」等效，不需額外 JS 就能觸發 file input；拖放（drag
          /drop 事件）由 T3.3 綁在 #file-drop 容器上，觸發的仍是同一個
          input，鍵盤等效＝直接 Tab 到 input 後按 Enter/Space 開啟原生選檔器。
        -->
        <div class="file-drop" id="file-drop">
          <label for="file-input" class="file-drop__label">
            <span class="file-drop__icon" aria-hidden="true">📁</span>
            <span class="file-drop__text">
              拖放 APNG 檔案到此處，或<span class="file-drop__button">選擇檔案</span>
            </span>
          </label>
          <input
            type="file"
            id="file-input"
            name="file"
            accept="image/png,image/apng"
            class="sr-only"
          />
        </div>
        <p id="selected-filename" class="selected-filename" hidden></p>
      </section>

      <section class="tool-section" aria-labelledby="options-heading">
        <h2 id="options-heading">轉換選項</h2>
        <div class="options-grid">
          <div class="option-field">
            <label for="alpha-threshold">透明門檻（0–255）</label>
            <input
              type="number"
              id="alpha-threshold"
              name="alphaThreshold"
              min="0"
              max="255"
              step="1"
              value="128"
            />
          </div>
          <div class="option-field">
            <label for="matte-color">半透明背景合成色</label>
            <input type="color" id="matte-color" name="matteColor" value="#ffffff" />
          </div>
        </div>
        <button type="button" id="convert-button" class="button-like">開始轉換</button>
      </section>

      <section
        class="tool-section"
        aria-labelledby="progress-heading"
        id="progress-section"
        hidden
      >
        <h2 id="progress-heading">轉換進度</h2>
        <progress
          id="progress-bar"
          max="100"
          value="0"
          aria-labelledby="progress-heading"
        ></progress>
        <p role="status" aria-live="polite" id="progress-status"></p>
      </section>

      <!--
        錯誤／警示容器刻意不使用 hidden：SR 的 live-region 監看是掛在既有
        節點上，若在節點還沒進入 a11y tree（hidden）時就設定 textContent，
        再事後 unhide，等於「內容已就緒的節點忽然整個出現」，多數 SR 不會
        當成 live-region 內容變化播報。改為永遠掛載＋以 .is-empty 收合視覺
        (見 style.css)，main.ts 只透過 textContent 讀寫，不再切換 hidden。
      -->
      <div role="alert" id="error-message" class="error-message is-empty"></div>

      <div role="status" id="warning-message" class="warning-message is-empty">
        <p id="warning-text"></p>
        <button type="button" id="warning-continue-button" class="button-like" hidden>
          仍要繼續
        </button>
      </div>

      <section class="preview-grid">
        <div class="preview-panel" aria-labelledby="original-preview-heading">
          <h2 id="original-preview-heading">原始 APNG 預覽</h2>
          <img id="original-preview" alt="" hidden />
        </div>
        <!--
          tabindex="-1"：轉換完成時 T3.3 會對此容器呼叫 focus()，讓焦點移到
          結果區並由 status 訊息宣告完成（PLAN WCAG 4.1.3）；-1 只允許程式化
          聚焦，不會讓它出現在一般 Tab 順序中。
        -->
        <div
          class="preview-panel"
          aria-labelledby="result-preview-heading"
          id="result-section"
          tabindex="-1"
        >
          <h2 id="result-preview-heading">轉換後 GIF 預覽</h2>
          <img id="result-preview" alt="" hidden />
          <button
            type="button"
            id="play-pause-button"
            class="button-like button-like--secondary"
            aria-pressed="false"
            hidden
          >
            暫停
          </button>
          <!--
            download 佔位：href 刻意留空，因下載目標是轉換完成後才產生的
            blob URL。T3.3 顯示此連結前，除了移除 hidden 也必須設定 href，
            否則它不具連結語意（無 href 的 <a> 不會出現在 Tab 順序）。
          -->
          <a id="download-link" download hidden>下載 GIF</a>
        </div>
      </section>
    </main>
    <footer>
      <p>ClientKit — 所有處理皆於瀏覽器端完成，不會上傳任何資料。</p>
      <p>
        © 2026 alan60910 · <a href="https://github.com/alan60910">GitHub</a> ·
        <a href="https://github.com/alan60910/ClientKit/blob/main/LICENSE">MIT License</a>
      </p>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
